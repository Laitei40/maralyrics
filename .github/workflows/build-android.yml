name: Build Android admin app

# Builds and signs the MaraLyrics Admin Trusted Web Activity APK
# (android/) on GitHub's runners, since the sandbox that scaffolded this
# project can't reach dl.google.com to download the Android SDK itself.
#
# One-time setup before this can produce a signed APK: add these four
# repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - `base64 -w0 maralyrics-admin-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         - "maralyrics-admin"
#   ANDROID_KEY_PASSWORD      - same as ANDROID_KEYSTORE_PASSWORD (PKCS12)
# Without them, this still builds a debug-signed APK (useful to sanity-check
# the project compiles) but it won't verify against
# public/.well-known/assetlinks.json on a real device.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build debug APK (no keystore secret configured yet)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building a debug-signed APK instead of a release one. See the comment at the top of this workflow file for the one-time setup."
          ./gradlew assembleDebug

      - name: Remove decoded keystore
        if: always() && steps.keystore.outputs.has_keystore == 'true'
        run: rm -f release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maralyrics-admin-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
